name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Mod version, e.g. 1.1.0 or 1.1.0-beta.1'
        required: true
        type: string
      publish:
        description: 'Publish to CurseForge and Modrinth (false validates only)'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Invalid release version'; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      mod_version: ${{ needs.prepare.outputs.version }}
  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: respawnhost-integration-*-jars
          path: artifacts
      - name: Validate complete release without uploading
        env:
          MOD_VERSION: ${{ needs.prepare.outputs.version }}
        run: python deploy/upload.py artifacts --dry-run
      - name: Generate changelog
        run: |
          annotation=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$annotation" ]; then
            printf '%s\n' "$annotation" > changelog.txt
          elif [ -n "$previous" ]; then
            git log --pretty=format:'- %s' "$previous..HEAD" > changelog.txt
          else
            git log --pretty=format:'- %s' -n 20 HEAD > changelog.txt
          fi
      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v$MOD_VERSION"
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            if ! python -c 'import json,sys; sys.exit(0 if json.load(open("release-state.json"))["isDraft"] else 1)'; then
              echo "Release $tag is already published; refusing to replace its assets."
              exit 1
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "$tag" --notes-file changelog.txt
          fi
          mapfile -d '' jars < <(find artifacts -type f -name '*.jar' -print0)
          gh release upload "$tag" "${jars[@]}" --clobber
          if [[ "$MOD_VERSION" =~ (alpha|beta|rc) ]]; then
            gh release edit "$tag" --draft=false --prerelease
          else
            gh release edit "$tag" --draft=false --latest
          fi
      - name: Publish to CurseForge and Modrinth
        if: github.event_name == 'push' || inputs.publish
        env:
          MOD_VERSION: ${{ needs.prepare.outputs.version }}
          CHANGELOG_FILE: changelog.txt
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
        run: python deploy/upload.py artifacts
