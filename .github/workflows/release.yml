name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build core
        run: |
          chmod +x core/gradlew
          cd core && ./gradlew build --no-daemon

  build:
    runs-on: ubuntu-latest
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.12.2-forge"
            java: "8"
          - version: "1.13.2-forge"
            java: "8"
          - version: "1.14.4-forge"
            java: "8"
          - version: "1.14.4-fabric"
            java: "17"
          - version: "1.15.2-forge"
            java: "8"
          - version: "1.15.2-fabric"
            java: "17"
          - version: "1.16.5-forge"
            java: "17"
          - version: "1.16.5-fabric"
            java: "17"
          - version: "1.17.1-forge"
            java: "17"
          - version: "1.17.1-fabric"
            java: "17"
          - version: "1.18.2-forge"
            java: "17"
          - version: "1.18.2-fabric"
            java: "17"
          - version: "1.19.2-forge"
            java: "17"
          - version: "1.19.2-fabric"
            java: "17"
          - version: "1.20.1-forge"
            java: "17"
          - version: "1.20.1-fabric"
            java: "17"
          - version: "1.20.6-neoforge"
            java: "21"
          - version: "1.20.6-fabric"
            java: "21"
          - version: "1.21.1"
            java: "21"
          - version: "26.1-neoforge"
            java: "26"
          - version: "26.1-fabric"
            java: "26"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Strip tag prefix
        run: echo "MOD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.version }}
        run: |
          chmod +x versions/${{ matrix.version }}/gradlew
          cd versions/${{ matrix.version }} && ./gradlew build --no-daemon -Pmod_version="$MOD_VERSION"

      - name: Upload ${{ matrix.version }} jars
        uses: actions/upload-artifact@v4
        with:
          name: respawnhost-integration-${{ matrix.version }}-jars
          path: |
            versions/${{ matrix.version }}/**/build/libs/*.jar
            !versions/${{ matrix.version }}/**/build/libs/*-sources.jar
            !versions/${{ matrix.version }}/**/build/libs/*-dev-shadow.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: respawnhost-integration-*-jars
          path: artifacts

      - name: Strip tag prefix
        run: echo "MOD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate changelog
        run: |
          annotation=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$annotation" ]; then
            printf '%s\n' "$annotation" > changelog.txt
          elif [ -n "$prev" ]; then
            git log --pretty=format:'- %s' "$prev..$GITHUB_REF_NAME" > changelog.txt
          else
            git log --pretty=format:'- %s' -n 20 "$GITHUB_REF_NAME" > changelog.txt
          fi
          {
            echo "CHANGELOG<<CHANGELOG_EOF"
            cat changelog.txt
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_ENV"

      - name: Upload to Modrinth and CurseForge
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
        run: bash deploy/upload.sh artifacts
