name: Build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      mod_version:
        type: string
        default: '1.0.0'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s deploy -p 'test_*.py'
      - id: matrix
        run: echo "matrix=$(python deploy/artifacts.py --matrix)" >> "$GITHUB_OUTPUT"
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x core/gradlew && core/gradlew -p core build --no-daemon
  variants:
    needs: [prepare, core]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and collect production jars
        env:
          VARIANT: ${{ matrix.variant }}
          MOD_VERSION: ${{ inputs.mod_version || '1.0.0' }}
        run: |
          chmod +x "versions/$VARIANT/gradlew"
          "versions/$VARIANT/gradlew" -p "versions/$VARIANT" build --no-daemon -Pmod_version="$MOD_VERSION"
          python deploy/artifacts.py --variant "$VARIANT" --version "$MOD_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: respawnhost-integration-${{ matrix.variant }}-jars
          path: dist/*
          if-no-files-found: error
