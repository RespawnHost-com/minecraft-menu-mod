buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = project.findProperty("mod_version") ?: System.getenv("MOD_VERSION") ?: "1.0.0"
group = 'com.respawnhost'
archivesBaseName = 'respawnhost_integration-1.14.4-forge'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'official', version: '1.14.4'

    runs {
        client {
            workingDirectory project.file('run')

            mods {
                respawnhost_integration {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.14.4-28.2.26'
    compile 'com.respawnhost:respawnhost-core:1.0.0'
}

jar {
    from({
        configurations.compile.findAll { it.name.contains('respawnhost-core') }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'com/google/gson/**'
    }
    manifest {
        attributes([
                "Specification-Title"   : "respawnhost_integration",
                "Specification-Vendor"  : "RespawnHost",
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" : "RespawnHost"
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
