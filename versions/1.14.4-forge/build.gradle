buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = '1.0.0'
group = 'com.respawnhost'
archivesBaseName = 'respawnhost_integration-1.14.4-forge'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

def coreLibsDir = file("${rootDir}/../../core/build/libs")
def coreJar = file("${coreLibsDir}/respawnhost-core-1.0.0.jar")

task buildCore(type: Exec) {
    onlyIf { !coreJar.exists() }
    workingDir "${rootDir}/../../core"
    environment 'JAVA_HOME', System.getenv('CORE_JAVA_HOME') ?: 'C:/Program Files/BellSoft/LibericaJDK-17-Full'
    commandLine 'cmd', '/c', 'gradlew.bat', 'jar', '--no-daemon', '-q'
    outputs.file coreJar
}

minecraft {
    mappings channel: 'official', version: '1.14.4'

    runs {
        client {
            workingDirectory project.file('run')

            mods {
                respawnhost_integration {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.14.4-28.2.26'
    compileOnly files(coreJar)
}

compileJava.dependsOn buildCore

jar {
    dependsOn buildCore
    from(zipTree(coreJar)) {
        exclude 'com/google/**'
        exclude 'META-INF/**'
    }
    manifest {
        attributes([
                "Specification-Title"   : "respawnhost_integration",
                "Specification-Vendor"  : "RespawnHost",
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" : "RespawnHost"
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
