plugins {
    id "dev.architectury.loom" version "1.7-SNAPSHOT"
}

loom {
    silentMojangMappingsLicense()
}

base {
    archivesName = "respawnhost-integration-1.20.6-fabric"
}

version = project.findProperty("mod_version") ?: System.getenv("MOD_VERSION") ?: project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation("com.respawnhost:respawnhost-core:1.0.0") { transitive = false }
    include("com.respawnhost:respawnhost-core:1.0.0") { transitive = false }
}

processResources {
    def replaceProperties = [version: project.version]
    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(21)
}
