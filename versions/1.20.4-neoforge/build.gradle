plugins {
    id "dev.architectury.loom" version "1.7-SNAPSHOT"
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

loom {
    silentMojangMappingsLicense()
}

base {
    archivesName = "respawnhost-integration-1.20.4-neoforge"
}

version = project.findProperty("mod_version") ?: System.getenv("MOD_VERSION") ?: project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url "https://maven.neoforged.net/releases" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    implementation "com.respawnhost:respawnhost-core:1.0.0"
    shadow("com.respawnhost:respawnhost-core:1.0.0") { transitive = false }
}

processResources {
    def replaceProperties = [version: project.version]
    inputs.properties replaceProperties

    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadow]
    exclude "com/google/**"
    archiveClassifier.set("dev-shadow")
}

remapJar {
    input.set shadowJar.archiveFile
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(17)
}
